name: Deploy presentations to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build slide decks (Marp)
        run: |
          npm install -g @marp-team/marp-cli
          mkdir -p _site
          cp index.html _site/
          shopt -s nullglob
          for md in presentations/*/index.md; do
            dir="$(dirname "$md")"
            mkdir -p "_site/$dir"
            marp --no-stdin --theme theme/ames.css --html "$md" -o "_site/$dir/index.html"
            [ -d "$dir/images" ] && cp -r "$dir/images" "_site/$dir/"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
